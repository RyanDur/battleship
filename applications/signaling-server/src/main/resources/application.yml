server:
  address: ${SERVER_ADDRESS:localhost}
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:${user.home}/.battleship/data;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

app:
  version: @APP_VERSION@
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,https://ryandur.github.io}
  heartbeat-interval: ${HEARTBEAT_INTERVAL:5000}

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.tag || '' }}

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: "*.dmg"
            type: dmg
          - os: windows-latest
            artifact: "*.msi"
            type: msi
          - os: ubuntu-latest
            artifact: "*.deb"
            type: deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v8
        with:
          name: boot-jar
          path: boot-jar

      - uses: actions/download-artifact@v8
        with:
          name: app-icons
          path: icons

      - name: Smoke test boot jar
        shell: bash
        run: |
          JAR=$(ls boot-jar/*.jar | grep -v "\-plain\.jar")
          java -jar "$JAR" &
          JAR_PID=$!
          trap "kill $JAR_PID 2>/dev/null" EXIT

          RESPONSE=$(curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:8080/health)
          EXPECTED="${TAG#v}"
          echo "$RESPONSE" | grep -q "\"version\":\"$EXPECTED\"" || \
            { echo "Smoke test failed. Expected version: $EXPECTED, got: $RESPONSE"; exit 1; }
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - name: Select icon for platform
        shell: bash
        run: |
          case "${{ matrix.type }}" in
            dmg) echo "ICON_PATH=icons/icon.icns" >> "$GITHUB_ENV" ;;
            msi) echo "ICON_PATH=icons/icon.ico" >> "$GITHUB_ENV" ;;
            *)   echo "ICON_PATH=icons/icon_256.png" >> "$GITHUB_ENV" ;;
          esac

      - name: Build installer
        shell: bash
        run: |
          JAR=$(ls boot-jar/*.jar | grep -v "\-plain\.jar")
          JAR_DIR=$(dirname "$JAR")
          JAR_NAME=$(basename "$JAR")

          VERSION=${TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" -lt 1 ]; then MAJOR=1; fi
          MINOR_PATCH=$(echo "$VERSION" | cut -d. -f2-)
          APP_VERSION="$MAJOR.$MINOR_PATCH"

          mkdir -p build/jpackage
          jpackage \
            --input "$JAR_DIR" \
            --main-jar "$JAR_NAME" \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --name Battleship \
            --app-version "$APP_VERSION" \
            --type ${{ matrix.type }} \
            --dest build/jpackage \
            --icon "$ICON_PATH" \
            --java-options "-Xmx256m" \
            --java-options "-Djava.awt.headless=false"
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: build/jpackage/${{ matrix.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Write production config
        run: |
          VERSION=${TAG#v}
          echo "{\"version\":\"$VERSION\",\"serviceUrl\":\"http://localhost:8080\"}" > config.json
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "*"
          generate_release_notes: true

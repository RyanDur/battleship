name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.9.0)"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI to complete
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI on commit $COMMIT_SHA..."
          ATTEMPTS=0
          MAX_ATTEMPTS=40

          while true; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [ "$ATTEMPTS" -gt "$MAX_ATTEMPTS" ]; then
              echo "Timed out waiting for CI after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            RUN=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&per_page=1" --jq '.workflow_runs[0]')

            if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
              echo "No CI run found yet. Waiting..."
              sleep 30
              continue
            fi

            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.id')

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed (run $RUN_ID)"
                echo "CI_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
                break
              else
                echo "CI failed with conclusion: $CONCLUSION"
                exit 1
              fi
            fi

            echo "CI still running (status: $STATUS). Waiting..."
            sleep 30
          done

      - name: Download artifacts from CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run download "$CI_RUN_ID" -R "$REPO" -n dist -D dist
          gh run download "$CI_RUN_ID" -R "$REPO" -n boot-jar -D boot-jar
          gh run download "$CI_RUN_ID" -R "$REPO" -n app-icons -D app-icons

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: boot-jar
          path: boot-jar/

      - uses: actions/upload-artifact@v7
        with:
          name: app-icons
          path: app-icons/

  build:
    needs: wait-for-ci
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: "*.dmg"
            type: dmg
          - os: windows-latest
            artifact: "*.msi"
            type: msi
          - os: ubuntu-latest
            artifact: "*.deb"
            type: deb

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/download-artifact@v8
        with:
          name: boot-jar
          path: boot-jar

      - uses: actions/download-artifact@v8
        with:
          name: app-icons
          path: icons

      - name: Smoke test boot jar
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION=${TAG#v}
          JAR=$(ls boot-jar/*.jar | grep -v "\-plain\.jar")
          java -Dapp.version="$VERSION" -jar "$JAR" &
          JAR_PID=$!
          trap "kill $JAR_PID 2>/dev/null" EXIT

          RESPONSE=$(curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:8080/health)
          echo "$RESPONSE" | grep -q "\"version\":\"$VERSION\"" || \
            { echo "Smoke test failed. Expected version: $VERSION, got: $RESPONSE"; exit 1; }

      - name: Select icon for platform
        shell: bash
        run: |
          case "${{ matrix.type }}" in
            dmg) echo "ICON_PATH=icons/icon.icns" >> "$GITHUB_ENV" ;;
            msi) echo "ICON_PATH=icons/icon.ico" >> "$GITHUB_ENV" ;;
            *)   echo "ICON_PATH=icons/icon_256.png" >> "$GITHUB_ENV" ;;
          esac

      - name: Build installer
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          JAR=$(ls boot-jar/*.jar | grep -v "\-plain\.jar")
          JAR_DIR=$(dirname "$JAR")
          JAR_NAME=$(basename "$JAR")

          VERSION=${TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          if [ "$MAJOR" -lt 1 ]; then MAJOR=1; fi
          MINOR_PATCH=$(echo "$VERSION" | cut -d. -f2-)
          APP_VERSION="$MAJOR.$MINOR_PATCH"

          mkdir -p build/jpackage
          jpackage \
            --input "$JAR_DIR" \
            --main-jar "$JAR_NAME" \
            --main-class org.springframework.boot.loader.launch.JarLauncher \
            --name Battleship \
            --app-version "$APP_VERSION" \
            --type ${{ matrix.type }} \
            --dest build/jpackage \
            --icon "$ICON_PATH" \
            --java-options "-Xmx256m" \
            --java-options "-Djava.awt.headless=false" \
            --java-options "-Dapp.version=$VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: build/jpackage/${{ matrix.artifact }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist

      - name: Write production config
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          VERSION=${TAG#v}
          echo "{\"version\":\"$VERSION\",\"serviceUrl\":\"http://localhost:8080\"}" > config.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "*"
          generate_release_notes: true
